apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  FILE_UPLOADS_MOUNT_PATH: "/app/uploads"
  LANGFUSE_HOST: "https://cloud.langfuse.com"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
data:
  NODE_ENV: "production"
  # The frontend's server code calls the API here. The browser's URL, NEXT_PUBLIC_API_URL,
  # is fixed when the image is built (see README.md).
  API_INTERNAL_URL: "http://api:8000"
  # PostHog Analytics - Replace with your actual values
  # NEXT_PUBLIC_POSTHOG_KEY: "phc_your_project_key_here"
  # NEXT_PUBLIC_POSTHOG_HOST: "https://us.i.posthog.com"

