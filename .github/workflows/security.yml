name: Security Scan

on:
  pull_request:
    branches: ["**"]

# A new push to a PR cancels the scan of the commit it replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One runner scans all three images: the scans take a few minutes in total,
  # about what the backend tests take, so splitting them buys no wall time and
  # costs two slots from the org's shared pool of concurrent jobs. Trivy reuses
  # the vulnerability database it downloads for the first scan.
  scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        id: login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend Image
        run: docker build -t ai-reviewer-api:${{ github.sha }} -f Dockerfile .

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ai-reviewer-api:${{ github.sha }}
          format: table
          exit-code: 0
          scanners: vuln

      # The scans below don't need the backend image, so a failed build still
      # lets them run.

      # Scanned in two parts instead of building the image, whose `next build`
      # alone took over two minutes: the npm dependencies from the lockfile,
      # and the OS packages from the base image the Dockerfile starts from.
      - name: Scan Frontend Dependencies
        if: ${{ !cancelled() && steps.login.outcome == 'success' }}
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: frontend
          format: table
          exit-code: 0
          scanners: vuln

      - name: Read Frontend Base Image
        id: base-image
        if: ${{ !cancelled() && steps.login.outcome == 'success' }}
        run: echo "ref=$(awk 'toupper($1) == "FROM" { print $2; exit }' frontend/Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Scan Frontend Base Image
        if: ${{ !cancelled() && steps.base-image.outcome == 'success' }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.base-image.outputs.ref }}
          format: table
          exit-code: 0
          scanners: vuln

      - name: Scan PostgreSQL Image
        if: ${{ !cancelled() && steps.login.outcome == 'success' }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: pgvector/pgvector:pg16
          format: table
          exit-code: 0
          scanners: vuln
