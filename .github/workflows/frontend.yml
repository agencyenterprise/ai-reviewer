on:
  pull_request:
  # Branch pushes are already covered by their PR's run; pushes to these
  # branches are what's left: merges, and commits made straight to them.
  push:
    branches: [dev, main]

# A new push to a PR cancels the run on the commit it replaced. Pushes to dev
# and main are grouped by commit, so none of them is cancelled or left queued
# behind another: every merged commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ./frontend/package.json

      - name: Install dependencies
        run: pnpm install
        working-directory: ./frontend

      - name: Run lint
        run: pnpm run lint
        working-directory: ./frontend

      - name: Run tests
        run: pnpm run test
        working-directory: ./frontend

      - name: Run build
        run: pnpm run build
        working-directory: ./frontend
