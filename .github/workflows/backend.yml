on:
  pull_request:
  # Branch pushes are already covered by their PR's run; pushes to these
  # branches are what's left: merges, and commits made straight to them.
  push:
    branches: [dev, main]

# A new push to a PR cancels the run on the commit it replaced. Pushes to dev
# and main are grouped by commit, so none of them is cancelled or left queued
# behind another: every merged commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Check formatting
        run: uv run ruff format --check --diff .

      - name: Lint
        run: uv run ruff check --output-format=github .

  typecheck:
    name: mypy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      # mypy validates every cached entry against the source and its own
      # version, so a stale cache only costs re-checking what changed. Keyed per
      # commit so each run saves a fresh copy; PRs restore the latest one from
      # their own branch or from dev.
      - name: Cache mypy
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            mypy-${{ runner.os }}-

      - name: Run mypy
        run: uv run mypy .

  test:
    name: pytest (unit & integration)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync
        env:
          # Compile every package to bytecode once, in parallel, at install
          # time. Otherwise each xdist worker compiles the same imports on its
          # first run, which costs about a minute before any test starts.
          UV_COMPILE_BYTECODE: "1"

      - name: Run tests
        # Run only unit tests to avoid running integration tests which require a database.
        # `-n logical` sizes the worker pool to the runner's vCPUs (4) instead of
        # the 10 workers pyproject.toml sets for local runs. `-n auto` counts
        # physical cores and starts only 2.
        run: uv run pytest tests/unit -n logical --tb=short --cov --cov-branch --cov-report=xml
        env:
          PYTHONPATH: ${{ github.workspace }}
          # Database config (test environment)
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: test_db
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          # Auth config
          AUTH_SECRET: test-secret-key-for-ci
          # File uploads (temporary directory for tests)
          FILE_UPLOADS_MOUNT_PATH: /tmp/test-uploads
          # Optional - use secrets if available for LLM tests
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Optional Langfuse tracing
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
