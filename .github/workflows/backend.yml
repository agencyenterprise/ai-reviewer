on:
  pull_request:
  # Branch pushes are already covered by their PR's run; pushes to these
  # branches are what's left: merges, and commits made straight to them.
  push:
    branches: [dev, main]

# A new push to a PR cancels the run on the commit it replaced. Pushes to dev
# and main are grouped by commit, so none of them is cancelled or left queued
# behind another: every merged commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # ruff and mypy share one runner: together they take well under the unit
  # tests, so splitting them buys no wall time and costs a slot from the
  # org's shared pool of concurrent jobs.
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        id: deps
        run: uv sync

      - name: Check formatting
        run: uv run ruff format --check --diff .

      # Each check below runs even when an earlier one failed, so one push
      # reports every problem.
      - name: Lint
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run ruff check --output-format=github .

      # mypy validates every cached entry against the source and its own
      # version, so a stale cache only costs re-checking what changed. Keyed per
      # commit so each run saves a fresh copy; PRs restore the latest one from
      # their own branch or from dev.
      - name: Cache mypy
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            mypy-${{ runner.os }}-

      - name: Run mypy
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run mypy .

  # Both suites share one runner, so each PR takes one slot from the org's
  # shared pool of concurrent jobs instead of two. Paying for one setup costs
  # less than a second job: the integration suite and its Postgres container
  # add about 40s.
  test:
    name: pytest
    runs-on: ubuntu-latest
    # The suites take about two minutes; a stuck lock wait gives up after 5.
    timeout-minutes: 20

    services:
      # The image docker-compose.yml runs locally, so pgvector is available to the migrations.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_reviewer
          POSTGRES_USER: ai_reviewer_user
          POSTGRES_PASSWORD: ai_reviewer_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_reviewer_user -d ai_reviewer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONPATH: ${{ github.workspace }}
      AUTH_SECRET: test-secret-key-for-ci
      # File uploads (temporary directory for tests)
      FILE_UPLOADS_MOUNT_PATH: /tmp/test-uploads

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        id: deps
        run: uv sync
        env:
          # Compile every package to bytecode once, in parallel, at install
          # time. Otherwise each xdist worker compiles the same imports on its
          # first run, which costs about a minute before any test starts.
          UV_COMPILE_BYTECODE: "1"

      - name: Run unit tests
        # `-n logical` sizes the worker pool to the runner's vCPUs (4) instead of
        # the 10 workers pyproject.toml sets for local runs. `-n auto` counts
        # physical cores and starts only 2.
        run: uv run pytest tests/unit -n logical --tb=short --cov --cov-branch --cov-report=xml
        env:
          # Database config (test environment)
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          # Optional - use secrets if available for LLM tests
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Optional Langfuse tracing
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      # Runs even when the unit tests failed, so one push reports both suites.
      - name: Run integration tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run pytest tests/integration -n logical --tb=short
        env:
          # The tests create and migrate ai_reviewer_test, derived from this, on their own.
          DATABASE_URL: postgresql://ai_reviewer_user:ai_reviewer_password@localhost:5432/ai_reviewer
          # lib.api.mcp builds its auth provider at import and refuses to without a
          # login provider; nothing in the tests signs in, so placeholders do.
          AUTH_GOOGLE_ID: ci-placeholder
          AUTH_GOOGLE_SECRET: ci-placeholder
