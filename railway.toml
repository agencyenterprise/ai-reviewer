# Railway config as code. It covers build and deploy settings only: variables and
# volumes are set on the service in the Railway dashboard (docs/railway-deployment.md).
[build]
builder = "dockerfile"

[deploy]
preDeployCommand = ["uv run alembic upgrade head"]
startCommand = "sh scripts/start_api.sh"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "always"
