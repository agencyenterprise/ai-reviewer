    # Tree Canopy and Summer Surface Temperature in Riverton

    ## Methods

    We paired the 120 census tracts of Riverton (2020 boundaries, US Census TIGER/Line) with two public datasets. Daytime land surface temperature is the Landsat 8 Collection 2 Level-2 Surface Temperature band (ST_B10), taken from every scene over the city between 1 June and 31 August 2024 with less than 10 percent cloud cover, masked with the QA_PIXEL band and averaged per tract as the zonal mean of all clear pixels. Canopy coverage is the share of each tract's area under crown polygons in the Riverton Open Data tree inventory, 2024 release. Tracts were ranked by canopy coverage and split into terciles of 40; the reported value is the unweighted mean of the tract means within each tercile. The tract-level values are listed in Appendix Table A1.

    ## Results

    Figure 1 reports the mean summer surface temperature for each canopy tercile. Temperature falls steadily from the low- to the high-canopy tercile.

    ![](files/figures/rc_canopy.png)

    **Figure 1: Mean summer surface temperature by canopy tercile**

    ## Conclusion

    Higher canopy coverage is associated with cooler surfaces across the city. The gradient is consistent with the shading and evapotranspiration effects reported elsewhere.

