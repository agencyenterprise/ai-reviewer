  target_answer: 'The results are fully reproducible, but only if Appendix A is read: the methods section deliberately defers every parameter to it, and the appendix then supplies capacity, release and evaporation schedules, the generator settings and seed, the climate scaling factors, and the complete historical inflow record in Table A.1. Classifying these as not reproducible on the grounds that the methods section omits the parameters is the error this document is built to catch. All results should be informational (severity none).'
- id: algorithm_result
  input: |
    # A Streaming Algorithm for Near-Duplicate Detection in Submission Queues

    ## Introduction

    Editorial queues accumulate near-duplicate submissions: the same manuscript
    resubmitted with a changed title, or split across two records. This note
    presents a streaming algorithm for flagging near-duplicates as records arrive,
    and reports its accuracy on our internal editorial corpus.

    ## The algorithm

    The contribution of this note is Algorithm 1, stated below in full. It
    maintains a bounded sketch per record and compares each arrival against a
    banded index, so no pairwise comparison over the whole queue is required.

    ```
    Algorithm 1: StreamingNearDuplicate(record r, index I)
      input:  r, a record with fields (title, abstract, authors)
              I, a banded LSH index; b bands of rows each; initially empty
      params: k = 5           (shingle length, in words)
              h = 200         (number of MinHash permutations)
              b = 50          (bands)
              rows = 4        (rows per band; b * rows must equal h)
              tau = 0.62      (Jaccard threshold for a flag)
      output: F, the set of records flagged as near-duplicates of r

     1  text  <- lowercase(title + " " + abstract), punctuation stripped,
     2           runs of whitespace collapsed to one space
     3  S     <- the set of all contiguous k-word shingles of text
     4  if |S| < k then return empty set        // too short to sketch
     5  M     <- MinHash(S, h) using the permutation family in Equation 1
     6  C     <- empty multiset                 // candidate records
     7  for band j in 1..b do
     8      key <- hash of the rows of M in band j
     9      C   <- C union I.lookup(j, key)
    10  F <- empty set
    11  for each candidate c in the distinct members of C do
    12      if EstimatedJaccard(M, M_c) >= tau then
    13          if authors(r) and authors(c) share at least one surname then
    14              F <- F union {c}
    15  for band j in 1..b do
    16      I.insert(j, hash of the rows of M in band j, r)
    17  return F
    ```

    MinHash uses the standard universal family given in Equation 1:

    $$h_i(x) = \big((a_i x + c_i) \bmod p\big) \bmod 2^{32}$$

    with $p = 2^{61} - 1$, and $(a_i, c_i)$ for $i = 1 \ldots 200$ drawn once with
    Python's `random.Random(90210)` over $[1, p-1]$ and then held fixed. A shingle
    becomes the integer $x$ by taking the first 8 bytes of the SHA-256 digest of
    its UTF-8 encoding, big-endian, modulo $p$. A band key is the first 16 hex
    characters of the SHA-256 digest of that band's four MinHash values written as
    decimal integers and joined by single commas.
    `EstimatedJaccard` is the fraction of the 200 MinHash positions on which the
    two sketches agree. The author check on line 13 compares case-folded surnames
    after stripping accents.

    Algorithm 1 is complete as stated: every parameter, the hash family, the
    tie-breaking author rule, and the insertion order are fixed above, so it can be
    reimplemented from this document without reference to our code.

    ## Accuracy on the editorial corpus

    Table 1 reports precision and recall against the editorial team's manual
    duplicate labels, on the corpus of submissions received over an eighteen-month
    period.

    | Threshold tau | Precision | Recall | Flags per 1,000 records |
    |---|---|---|---|
    | 0.55 | 0.71 | 0.94 | 31.2 |
    | 0.62 | 0.88 | 0.89 | 18.7 |
    | 0.70 | 0.96 | 0.68 | 9.4 |

    Figure 1 plots the precision–recall curve over tau from 0.40 to 0.85.

    The corpus consists of unpublished submissions and the manual labels were
    applied by editorial staff during triage. Neither the submissions nor the label
    set can be released: the manuscripts are confidential to their authors, and the
    labelling was recorded in the editorial system rather than exported. The corpus
    size is not disclosed for the same reason.

    ## Conclusion

    At tau = 0.62 the algorithm flags roughly nineteen records per thousand and
    catches nine of ten known duplicates. Algorithm 1 can be reused directly; the
    accuracy figures above should be re-measured on any new corpus, since they
    depend on the duplicate rate of the queue they were measured on.
  expected_results:
  - id: alg1
    match:
    - algorithm 1
    - streamingnearduplicate
    - minhash
    class: fully_reproducible
    importance: central
  - id: tab1
    match:
    - table 1
    - '0.88'
    - flags per 1,000
    class: not_reproducible
    importance: central
  - id: fig1
    match:
    - figure 1
    - 0.40 to 0.85
    - precision–recall curve
    - precision-recall curve
    class: not_reproducible
    importance: supporting
  target_answer: 'Two kinds of result sit in one document. Algorithm 1 is itself a result and is fully reproducible: every parameter, the hash family in Equation 1, its seed, and the author tie-break are stated, so it can be reimplemented from the text. The accuracy figures in Table 1 and the curve in Figure 1 are not reproducible: the corpus is confidential unpublished submissions, the manual labels were never exported, and the corpus size is undisclosed. The algorithm should be informational; the accuracy results should carry real severities.'

