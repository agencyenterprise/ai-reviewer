# Dataset for the results_extraction (Reproducibility Check) e2e eval.
#
# Documents are inline rather than referenced: each record is then readable as
# one unit -- the document, the inventory it should produce, and the prose
# rubric -- and a change to a document cannot silently invalidate ground truth
# sitting in another file.
#
# Per record:
#   id                one per document, used as the Inspect sample id
#   input             the document under review
#   expected_results  the ground-truth inventory, one entry per result:
#                       id          stable name, used in scorer explanations
#                       match       substrings identifying the result in a
#                                   reported issue; must be unique *within* the
#                                   record, or one result captures another's
#                                   issue. Numbers make the best anchors.
#                       class       expected reproducibility class
#                       importance  central | supporting | incidental, compared
#                                   only between non-reproducible results and
#                                   only as an ordering
#                       required    false for a defensible-but-optional reading:
#                                   counts for class_accuracy and no_extras,
#                                   not for completeness (default true)
#   target_answer     per-sample rubric, graded as `sample_expectations`

