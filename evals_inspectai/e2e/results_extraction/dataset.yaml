- id: inline_simulation
  input: |
    # Queue Discipline and Tail Latency in a Simulated Request Scheduler

    ## Introduction

    Interactive services are judged on their slowest requests, not their average
    ones. This note compares three queue disciplines under a fixed synthetic load
    to quantify how much of the tail is attributable to the discipline itself
    rather than to the service-time distribution. Everything reported here is
    generated by the simulation described below; no measured or proprietary data is
    used.

    ## Methods

    The simulator is a single-server discrete-event queue written in Python 3.12.4
    using only the standard library. Arrivals follow a Poisson process with rate
    $\lambda = 600$ requests per second. Service times are drawn from a lognormal
    distribution with $\mu = -7.20$ and $\sigma = 1.10$ (natural log of seconds),
    giving a mean service time of 1.367 ms and a 99th percentile of 9.65 ms. The
    server has a single worker, so the offered utilisation is
    $\rho = \lambda E[S] = 0.820$.

    Three disciplines are compared:

    - **FIFO**: first in, first out.
    - **LIFO**: last in, first out, with no ageing.
    - **SJF-2**: shortest-job-first over the two-element head of the queue, using
      the exact service time as the sort key (an oracle, included as a bound).

    Each configuration is run for 2,000,000 completed requests after a warm-up of
    200,000 completed requests, which are discarded. Ten independent replications
    per discipline use seeds 1,001 through 1,010, passed to
    `random.Random(seed)`; no other source of randomness is used. Reported
    percentiles are the mean across the ten replications, with the half-width of
    the 95% confidence interval computed as $1.96 \cdot s / \sqrt{10}$ where $s$
    is the sample standard deviation across replications.

    Waiting time $W_i$ for request $i$ is recorded as completion time minus arrival
    time, excluding service time. Percentiles are computed on the pooled waiting
    times of a replication using the nearest-rank method.

    ## Results

    Equation 1 gives the closed form used as a sanity check on the FIFO arm, the
    Pollaczek–Khinchine mean waiting time for an M/G/1 queue:

    $$W = \frac{\rho}{1 - \rho} \cdot \frac{1 + C_v^2}{2} \cdot E[S]$$

    where $E[S]$ is the mean service time and $C_v$ is its coefficient of
    variation. With the parameters above ($E[S] = 1.367$ ms,
    $C_v = \sqrt{e^{\sigma^2} - 1} = 1.534$, $\rho = 0.820$) Equation 1 predicts a mean
    FIFO waiting time of 10.47 ms.

    Table 1 reports waiting-time percentiles by discipline, in milliseconds.

    | Discipline | Mean | p50 | p99 | p99.9 |
    |---|---|---|---|---|
    | FIFO | 10.43 ± 0.14 | 5.12 | 58.4 ± 1.6 | 121.3 ± 5.2 |
    | LIFO | 10.41 ± 0.15 | 0.67 | 152.0 ± 8.4 | 509.5 ± 36.1 |
    | SJF-2 | 8.66 ± 0.11 | 3.74 | 49.1 ± 1.4 | 110.6 ± 4.5 |

    The simulated FIFO mean of 10.43 ms agrees with Equation 1 to within 0.4%, which
    we take as evidence the simulator is correctly implemented. LIFO's mean matches
    FIFO's, as it must: neither discipline uses service times, so both are work
    conserving on the same arrival stream.

    Beyond the table, one result is worth stating on its own: LIFO improves the
    median by 87% relative to FIFO (5.12 ms to 0.67 ms) while making p99.9 worse by
    a factor of 4.2 (121.3 ms to 509.5 ms).
    The two effects come from the same mechanism, so a service that reports only
    median latency would record LIFO as a strict improvement.

    ## Conclusion

    Under this load, discipline choice moves the median and the far tail in
    opposite directions. The oracle bound (SJF-2) recovers only 17% of FIFO's mean
    waiting time (10.43 ms to 8.66 ms), which suggests that on this service-time distribution the
    achievable gain from smarter scheduling is small compared with the gain from
    reducing $\rho$.
  expected_results:
  - id: eq1
    match:
    - pollaczek
    - closed form
    - equation 1
    class: fully_reproducible
    importance: supporting
    required: false
  - id: tab1
    match:
    - table 1
    - percentiles by queue
    - waiting-time percentile
    - waiting time percentile
    class: fully_reproducible
    importance: central
  - id: lifo_tradeoff
    match:
    - '87'
    - trade-off
    - tradeoff
    - tail latency
    class: fully_reproducible
    importance: central
  - id: validation
    match:
    - 0.4%
    class: fully_reproducible
    importance: incidental
    required: false
  - id: sjf_gain
    match:
    - 17%
    - 17 percent
    class: fully_reproducible
    importance: incidental
    required: false
  - id: work_conservation
    match:
    - work conserving
    - work-conserving
    - matches FIFO's
    class: fully_reproducible
    importance: incidental
    required: false
  target_answer: 'Every result is fully reproducible: the document is a simulation study whose arrival and service distributions, utilisation, replication count, seeds (1001-1010), software version and percentile method are all stated in the text, and no external data is used. The results that must appear are Table 1 (waiting-time percentiles by discipline) and the textual finding that LIFO improves the median by 87% while worsening p99.9 by 4.2x. Equation 1 is the Pollaczek-Khinchine formula used as a check, so reporting it is reasonable but not required. Whatever is reported should be informational (severity none), with no missing ingredients claimed.'
- id: web_retrievable_params
  input: |
    # Levelised Cost of Onshore Wind at Three Candidate Sites

    ## Introduction

    This note estimates the levelised cost of energy (LCOE) for three candidate
    onshore wind sites using only published parameters. No site measurements were
    taken; every input is drawn from a public source named in the text so that the
    calculation can be audited independently.

    ## Methods

    LCOE is computed with the standard discounted-cash-flow definition given in
    Equation 1:

    $$\text{LCOE} = \frac{I_0 + \sum_{t=1}^{n} \frac{M_t}{(1+r)^t}}{\sum_{t=1}^{n} \frac{E_t}{(1+r)^t}}$$

    where $I_0$ is overnight capital cost, $M_t$ is operations and maintenance
    spend in year $t$, $E_t$ is net generation in year $t$, $r$ is the discount
    rate and $n$ is the economic life.

    Parameter values are taken as follows, and not re-derived here:

    Every source below is openly published and free to read; nothing here sits
    behind a paywall or a licence.

    - Capital cost, fixed and variable O&M, economic life, and the real weighted
      average cost of capital: the onshore wind rows of the NREL Annual Technology
      Baseline 2024, Moderate scenario, and its published financial assumptions.
    - Power curve: the 3.0 MW reference turbine power curve in the NREL reference
      turbine series (technical report NREL/TP-5000-38060), scaled to 3.0 MW by
      rated power as that report describes.
    - Long-term wind speed distribution at each site: the Global Wind Atlas 3.3
      100 m Weibull parameters for the site coordinates listed in Table 1.
    - Site air density: the Global Wind Atlas 3.3 mean air density layer at 100 m
      for the same coordinates. Power is corrected for density by scaling the
      power-curve wind speeds by $(\rho / 1.225)^{1/3}$, with 1.225 kg/m³ as the
      reference density.
    - Wake and availability losses: the 12.0% combined default in the NREL Annual
      Technology Baseline 2024 methodology documentation.

    Net annual generation is obtained by convolving the site Weibull distribution
    with the density-corrected power curve at 0.5 m/s bins, then applying the
    combined loss factor. The calculation was performed in a spreadsheet; no code
    was written, and the arithmetic follows Equation 1 directly.

    ## Results

    Table 1 gives the site coordinates, the resulting capacity factor, and LCOE.

    | Site | Coordinates | Mean wind speed (m/s) | Capacity factor | LCOE (USD/MWh) |
    |---|---|---|---|---|
    | Ridge A | 43.18 N, 7.42 W | 8.4 | 0.412 | 38.10 |
    | Plateau B | 41.95 N, 4.11 W | 7.1 | 0.318 | 49.35 |
    | Coastal C | 43.51 N, 8.02 W | 9.2 | 0.463 | 33.90 |

    Figure 1 plots LCOE against discount rate from 3% to 10% for all three sites,
    holding every other parameter fixed. The three curves do not cross: Coastal C
    remains the cheapest site across the whole range, and the ranking of the three
    sites is therefore insensitive to the discount rate within the interval
    considered.

    A third result concerns the loss assumption. Substituting the site-specific
    wake losses in that same NREL methodology documentation for the 12.0% default
    -- 13.4% for Ridge A, 10.9% for Plateau B and 14.1% for Coastal C, matched to
    sites by the terrain class each is assigned in Table 1 above -- gives LCOE
    values of
    38.71, 48.98 and 34.65 USD/MWh respectively. Every site moves by less than 1.20
    USD/MWh and the ranking is unchanged, so the result is insensitive to that
    choice.

    ## Conclusion

    On published parameters alone, Coastal C is the lowest-cost of the three
    candidate sites by roughly 4 USD/MWh, and that conclusion holds across the
    range of discount rates and loss assumptions considered here. A site-specific
    measurement campaign would be needed before committing capital, since the
    Global Wind Atlas distribution is modelled rather than measured.
  expected_results:
  - id: tab1
    match:
    - table 1
    - '33.90'
    - capacity factor
    class: reproducible_with_web_search
    importance: central
  - id: fig1
    match:
    - figure 1
    - discount rate
    class: reproducible_with_web_search
    importance: supporting
  - id: loss_sensitivity
    match:
    - '1.20'
    - wake
    class: reproducible_with_web_search
    importance: incidental
  target_answer: 'The LCOE calculation is fully specified by Equation 1 and the procedure, but every input parameter lives in a named public source rather than in the document: the NREL ATB 2024 and its methodology documentation, an NREL reference-turbine report, and the Global Wind Atlas. Every one is openly published, so these are individual public values a reader can look up, so the results are reproducible with web search, not fully reproducible and not dependent on a bulk data upload. All results should be informational (severity none), and each rationale should name the external sources that have to be retrieved.'
- id: public_dataset_uploads
  input: |
    # Interconnection Queue Duration and Project Withdrawal, 2015–2023

    ## Introduction

    Developers report that interconnection delay is now the binding constraint on
    new generation. This note quantifies the relationship between time spent in an
    interconnection queue and the probability that a project is withdrawn, using
    the public queue records published by the system operators themselves.

    ## Methods

    The analysis covers four balancing authorities: CAISO, PJM, MISO and ERCOT.
    For each, we use the operator's published interconnection queue file as posted
    on its own website: the CAISO Queue Cluster reports, the PJM New Services Queue
    export, the MISO Generator Interconnection Queue workbook, and the ERCOT
    Generation Interconnection Status report. Each file is a complete public
    register of requests, one row per request, and each is tens of thousands of
    rows; the analysis reads the files in full rather than sampling.

    Request-level fields used are: queue identifier, request date, requested
    capacity (MW), fuel type, county, current status, and withdrawal or
    commercial-operation date where present. Records are pooled across the four
    operators and restricted to requests submitted between 1 January 2015 and 31
    December 2023 inclusive, giving the study population. Duplicate identifiers
    within an operator are dropped, keeping the most recent row by status date.
    Requests still active at the end of 2023 are treated as right-censored at that
    date.

    Queue duration is the number of days from request date to the earlier of
    withdrawal, commercial operation, or censoring. Withdrawal is modelled with a
    Cox proportional-hazards model, with queue duration as the time scale and
    covariates for requested capacity (log MW), fuel type (solar, wind, storage,
    gas, other), operator, and submission year as a linear term. The proportional
    hazards assumption was checked with scaled Schoenfeld residuals. Models were
    fitted in R 4.4.1 with survival 3.7-0, using Efron's method for ties.

    ## Results

    Table 1 reports the fitted hazard ratios for withdrawal with 95% confidence
    intervals, by covariate.

    | Covariate | Hazard ratio | 95% CI |
    |---|---|---|
    | log requested capacity (MW) | 1.14 | 1.11–1.18 |
    | Solar (vs gas) | 1.62 | 1.52–1.73 |
    | Storage (vs gas) | 1.31 | 1.21–1.42 |
    | Wind (vs gas) | 1.48 | 1.37–1.60 |
    | Submission year (per year) | 1.09 | 1.07–1.11 |

    Figure 1 shows Kaplan–Meier withdrawal curves by fuel type across the pooled
    population, with 95% confidence bands.

    The headline finding, stated here rather than in a figure: a project submitted
    in 2023 faces a withdrawal hazard 1.9 times that of an otherwise identical
    project submitted in 2015. The year term is fitted as a single linear
    coefficient, so monotonicity across the nine submission cohorts follows by
    construction rather than being an independent finding.

    ## Conclusion

    Withdrawal risk has risen steadily over the study period and is highest for the
    resource types that dominate current queues. Because every input is a public
    register, the estimates here can be recomputed by anyone who obtains the four
    queue files for the same period.
  expected_results:
  - id: tab1
    match:
    - table 1
    - hazard ratio
    - '1.62'
    class: reproducible_with_external_uploads
    importance: central
  - id: fig1
    match:
    - figure 1
    - kaplan
    class: reproducible_with_external_uploads
    importance: supporting
  - id: cohort_trend
    match:
    - '1.9'
    class: reproducible_with_external_uploads
    importance: central
  target_answer: 'The Cox model is fully specified (time scale, covariates, tie handling, software versions, censoring rule), and every input is an open public register published by the system operators. Reproduction therefore needs those four large queue files to be obtained and loaded, which is the ''reproducible with external uploads'' case rather than web search: the inputs are bulk datasets, not individual published values. All results should be informational (severity none).'
- id: proprietary_churn
  input: |
    # Churn Reduction from the Loyalty Programme Redesign

    ## Introduction

    The loyalty programme was redesigned in the second quarter and rolled out to
    part of the base. This report summarises what the redesign did to churn and to
    average revenue per user, and recommends completing the rollout.

    ## Approach

    The evaluation compares subscribers who were moved to the redesigned programme
    against those who remained on the legacy programme over the following two
    quarters. Assignment was handled by the growth team's existing targeting
    system. Outcome data comes from the internal subscriber warehouse; billing
    figures come from the finance system of record. Both are confidential and
    governed by the customer data agreement, so no extract is included with this
    report.

    Churn is measured as the internal definition used in the quarterly board pack.
    Revenue is net of promotional credits, following the finance team's standard
    treatment. Differences between groups were tested for significance and the
    analysis controlled for the usual confounders. The modelling was carried out by
    the data science team using the standard internal pipeline.

    ## Findings

    Table 1 summarises outcomes by group.

    | Group | Subscribers | Quarterly churn | ARPU change |
    |---|---|---|---|
    | Redesigned programme | (withheld) | 4.1% | +2.8% |
    | Legacy programme | (withheld) | 5.6% | +0.4% |

    Figure 1 plots weekly churn for both groups across the two quarters, with the
    rollout date marked. The gap opens in the third week after rollout and persists.

    The headline result is that the redesign reduced quarterly churn by 1.5
    percentage points, a relative reduction of 27%, and that the difference was
    statistically significant. A secondary result is that ARPU rose faster in the
    redesigned group, which suggests the churn reduction is not being bought with
    discounts.

    Segment-level results are available on request from the growth team but are not
    reproduced here, as segment definitions are commercially sensitive.

    ## Recommendation

    Complete the rollout to the remaining base in the next quarter and revisit the
    tier thresholds once a full year of post-rollout data is available.
  expected_results:
  - id: tab1
    match:
    - table 1
    - '4.1'
    - '5.6'
    class: not_reproducible
    importance: central
  - id: fig1
    match:
    - figure 1
    - weekly churn
    class: not_reproducible
    importance: supporting
  - id: churn_effect
    match:
    - '1.5'
    - 27%
    class: not_reproducible
    importance: central
  - id: arpu
    match:
    - arpu growth
    - rose faster
    - not being bought
    class: not_reproducible
    importance: supporting
  - id: segments
    match:
    - segment
    class: not_reproducible
    importance: incidental
    required: false
  target_answer: 'Nothing here is reproducible: the subscriber and billing data are confidential and withheld, group sizes are redacted, assignment was done by an unspecified targeting system, and the churn definition, the controls, the significance test and the ''standard internal pipeline'' are all referred to without being stated. Each result should carry a real severity, and the rationales should name the missing data and the missing procedural detail rather than only observing that the data is confidential.'
- id: mixed_classes
  input: |
    # Four Estimates of Residential Heat-Pump Retrofit Cost

    ## Introduction

    This report brings together four estimates of what it costs to retrofit a
    detached house with an air-source heat pump. The four rest on very different
    evidence, and we have kept them separate rather than blending them into a
    single number, because a reader needs to know which estimate they can check.

    ## Estimate 1: Engineering model

    The engineering estimate is produced by the cost model given in Equation 1:

    $$C = a \cdot Q_{\text{design}} + b \cdot A_{\text{emitter}} + c$$

    where $Q_{\text{design}}$ is design heat loss in kW, $A_{\text{emitter}}$ is
    the total emitter area added in m², and the coefficients are $a = 862$ GBP/kW,
    $b = 272$ GBP/m² and $c = 3{,}018$ GBP, fitted by ordinary least squares to the
    18 worked examples listed in Table 1 below. Applying Equation 1 to the
    reference dwelling ($Q_{\text{design}} = 7.4$ kW, $A_{\text{emitter}} = 11.0$
    m²) gives **12,389 GBP**. Table 1 gives all 18 examples with their heat loss,
    emitter area and installed cost, so both the fit and the point estimate can be
    recomputed from this document alone.

    | # | Heat loss (kW) | Emitter area (m²) | Installed cost (GBP) |
    |---|---|---|---|
    | 1 | 4.1 | 6.0 | 8,320 |
    | 2 | 4.6 | 7.8 | 9,360 |
    | 3 | 5.1 | 8.6 | 9,660 |
    | 4 | 5.7 | 8.3 | 10,020 |
    | 5 | 6.2 | 9.3 | 11,130 |
    | 6 | 6.7 | 10.0 | 11,520 |
    | 7 | 7.2 | 11.7 | 12,070 |
    | 8 | 7.8 | 12.1 | 12,970 |
    | 9 | 8.3 | 13.6 | 13,840 |
    | 10 | 8.8 | 12.6 | 13,940 |
    | 11 | 9.3 | 15.9 | 15,050 |
    | 12 | 9.9 | 15.6 | 15,890 |
    | 13 | 10.4 | 17.1 | 16,870 |
    | 14 | 10.9 | 17.4 | 17,160 |
    | 15 | 11.4 | 18.1 | 17,670 |
    | 16 | 12.0 | 19.6 | 18,800 |
    | 17 | 12.5 | 20.7 | 19,580 |
    | 18 | 13.0 | 20.9 | 19,870 |

    ## Estimate 2: National scheme statistics

    The scheme estimate uses the published median installed cost for air-source
    heat pumps under the Boiler Upgrade Scheme, as reported in the Department for
    Energy Security and Net Zero's *Boiler Upgrade Scheme statistics*, November
    2024 release, Table 4, uprated to Q4 2024 prices with the ONS construction
    output price index series CPI4 (dataset ID `constructionoutputpriceindices`).
    That gives **13,100 GBP**, and Figure 1 plots the scheme median by quarter from
    scheme launch to the November 2024 release. Both the level and the series are
    public figures a reader can look up; neither is reproduced here in full.

    ## Estimate 3: Household survey re-analysis

    The survey estimate re-analyses the English Housing Survey household file,
    2022–23. Households are matched to the reference dwelling on four variables:
    dwelling type (detached), floor-area band (90–119 m²), construction-age band
    (1945–1980) and Government Office Region, which for the reference dwelling is
    the South West. The outcome is the household's total
    reported heating-system replacement expenditure; households that report a
    replacement but no figure are dropped rather than imputed, and that drop is
    modelled below rather than ignored. Each matched household is weighted by the
    survey's own grossing weight multiplied by the inverse of its predicted
    probability of reporting a figure, from a logistic model fitted on the same
    four matching variables plus tenure. The estimate is the weighted mean of
    those expenditures, **14,750 GBP**, and the interval is a percentile bootstrap
    over 2,000 resamples of the matched set, resampled at household level with the
    weights recomputed within each resample, giving 13,900–15,620 GBP.

    Every step above is stated, but the microdata itself is not: the household
    file is a large open release obtained through the UK Data Service under the
    standard end-user licence, far too large to include here, and it has to be
    downloaded and loaded before any of this can be rerun.

    ## Estimate 4: Installer quotations

    The quotation estimate is the mean of quotations obtained from installers on
    the reference dwelling, at **16,200 GBP**. The quotations were provided
    commercially in confidence and the individual figures, the installers'
    identities, and the regional breakdown cannot be published. The mean is stated
    here; the underlying quotations are not available to any reader outside the
    project team, and the selection of installers approached was made by the
    project's industry partner using criteria that were not recorded.

    ## Conclusion

    The four estimates span 12,389 to 16,200 GBP, a spread of 31%. The spread is
    not noise: it tracks how much of each estimate's basis is publicly checkable.
  expected_results:
  - id: engineering
    match:
    - 12,389
    - '12389'
    class: fully_reproducible
    importance: central
  - id: scheme
    match:
    - 13,100
    - '13100'
    class: reproducible_with_web_search
    importance: central
  - id: survey
    match:
    - 14,750
    - '14750'
    class: reproducible_with_external_uploads
    importance: central
  - id: quotations
    match:
    - 16,200
    - '16200'
    class: not_reproducible
    importance: central
  - id: fig1
    match:
    - figure 1
    - by quarter
    class: reproducible_with_web_search
    importance: supporting
    required: false
  - id: fitted_model
    match:
    - '862'
    class: fully_reproducible
    importance: supporting
    required: false
  - id: spread
    match:
    - 31%
    class: fully_reproducible
    importance: incidental
    required: false
  - id: spread_interpretation
    match:
    - tracks how much
    - publicly checkable
    - not noise
    class: not_reproducible
    importance: incidental
    required: false
  target_answer: This document carries one result per reproducibility class and they must not be collapsed together. Estimate 1 is fully reproducible (Equation 1 plus all 18 fitting examples in Table 1). Estimate 2 is reproducible with web search (published scheme median and a named ONS index series). Estimate 3 is reproducible with external uploads (the English Housing Survey microdata has to be downloaded). Estimate 4 is not reproducible (confidential quotations, unrecorded installer selection). Only the fourth should carry a real severity; the first three are informational.
- id: central_and_incidental
  input: |
    # Does the Mentoring Programme Improve Retention? A Two-Year Follow-Up

    ## Introduction

    The mentoring programme was introduced two years ago with retention as its
    stated goal. This report answers the question the programme was funded to
    answer: do mentored staff stay longer? Everything else in the report is
    context for that answer.

    ## Approach

    Mentored and unmentored staff were compared over the twenty-four months
    following enrolment. Retention was taken from the HR system. Participation
    records were supplied by the programme office. The comparison controlled for
    the factors that seemed relevant. Statistical testing was carried out using
    the department's usual approach.

    Alongside the retention analysis, the programme office ran a short satisfaction
    survey and recorded when responses arrived, which we mention below for
    completeness.

    ## Findings

    ### Retention at twenty-four months

    The central finding of this report is that retention at twenty-four months was
    81% among mentored staff and 68% among unmentored staff, a difference of 13
    percentage points. This difference is the basis for the recommendation in the
    final section, and the case for continuing the programme rests on it entirely.

    The comparison groups were not formed at random: staff opted into mentoring,
    and the programme office's enrolment records do not retain the date of opting
    in, so we could not establish how long each person had been enrolled before
    the observation window. The controls applied are described in the HR analytics
    team's internal note, which is not published. Neither the underlying HR
    extract nor the participation records can be released, as both identify
    individuals in small teams.

    ### Satisfaction survey response timing

    Incidentally, 62% of survey responses arrived within the first three days of
    the survey being open, and the remainder trickled in over the following two
    weeks. We note this only because it may be useful to whoever runs the next
    survey; nothing in this report depends on it. The response timestamps were not
    retained after the survey closed, and the survey instrument itself was not
    kept.

    ## Recommendation

    Continue the programme for a further two years, and put in place the enrolment
    date capture that would let the next evaluation establish exposure properly.
  expected_results:
  - id: retention
    match:
    - '81'
    - 13 percentage
    class: not_reproducible
    importance: central
  - id: response_timing
    match:
    - '62'
    - three days
    class: not_reproducible
    importance: incidental
  target_answer: 'Both results are not reproducible -- the HR extract and participation records cannot be released, the controls are in an unpublished note, enrolment dates were not kept, and the survey timestamps and instrument were discarded. The distinction the document makes is importance: the 24-month retention difference is the finding the recommendation rests on entirely, while the survey response timing is explicitly incidental and nothing depends on it. The retention result must therefore carry a higher severity than the response-timing result.'
- id: appendix_parameters
  input: |
    # Sensitivity of a Reservoir Yield Model to Inflow Assumptions

    ## Introduction

    Reservoir yield estimates are sensitive to the inflow series they are driven
    with. This note reports the yield of a single reservoir under three inflow
    assumptions and shows how much of the spread in published yield figures for
    this reservoir can be explained by that choice alone.

    ## Methods

    The reservoir is modelled as a single mass-balance store on a monthly time
    step, following Equation 1:

    $$S_{t+1} = \min\left(S_{\max},\ \max\left(0,\ S_t + I_t - D_t - E_t - R_t\right)\right)$$

    where $S_t$ is storage at the start of month $t$, $I_t$ is inflow, $D_t$ is
    demand withdrawal, $E_t$ is net evaporation, $R_t$ is compensation release and
    $S_{\max}$ is usable capacity. Yield is defined as the largest constant monthly
    demand $D$ that can be met in every month of the simulation without storage
    reaching zero, found by bisection to a tolerance of 0.01 Ml/d. Yield is
    solved separately for each replicate of a stochastic set, and the reported
    figure is the median of those replicate yields. A month counts as
    a failure when the mass balance would drive $S_{t+1}$ below zero; storage is
    then held at zero and the shortfall is not carried forward. The 99% variant
    reported below relaxes the criterion to at most 1% of simulated months failing,
    with failures defined the same way. The critical drawdown period is the longest
    run of consecutive months over which storage falls monotonically in the
    historical case.

    The three inflow assumptions are the historical series, a stochastically
    generated series, and a climate-adjusted series. The parameter values behind
    each of these, the reservoir's physical characteristics, the evaporation and
    compensation-release schedules, and the generator settings are all listed in
    Appendix A rather than in this section, to keep the method readable. Nothing
    used in the calculation is omitted from Appendix A.

    ## Results

    Table 1 gives the yield obtained under each inflow assumption.

    | Inflow assumption | Yield (Ml/d) | Change vs historical |
    |---|---|---|
    | Historical (2011–2020) | 37.1 | — |
    | Stochastic (1,000 × 60 years) | 32.8 | −11.6% |
    | Climate-adjusted (2050s, central) | 36.5 | −1.6% |

    Figure 1 shows the storage trace for the critical drawdown period under each
    assumption, with the historical critical period highlighted. Each trace is
    drawn at that case's own yield demand from Table 1; the stochastic trace is
    the replicate whose minimum storage is the 500th-lowest of the 1,000
    replicates,
    plotted over its own critical drawdown period rather than aligned to the
    historical one.

    A further result concerns the shape of the yield–reliability relationship:
    relaxing the requirement from every month to 99% of months raises the
    historical yield only to 37.2 Ml/d, a 0.3% increase, and the climate-adjusted
    yield by 0.4%. The relaxation buys almost nothing here, which tells us the
    binding constraint is a multi-month drawdown rather than any single dry month:
    permitting 1% of months to fail does not shorten the critical period.

    ## Conclusion

    Two published yield figures exist for this reservoir: 48.0 Ml/d in the 1998
    drought review and 33.5 Ml/d in the 2019 water resource management plan, a
    spread of 14.5 Ml/d. Varying the inflow assumption alone, holding the reservoir
    model fixed, moves yield by 4.3 Ml/d between the historical and stochastic
    cases -- 30% of that spread -- so the choice of inflow series accounts for
    under a third of the disagreement between the two published figures, and the
    rest has to come from the reservoir model or the reliability standard.

    ## Appendix A: Parameter values

    **Reservoir.** Usable capacity $S_{\max} = 9{,}840$ Ml. Dead storage 610 Ml
    (excluded from $S_{\max}$). Surface area at full 1.42 km², assumed constant.
    Initial storage set to full at the start of each simulation.

    **Compensation release.** $R_t = 4.1$ Ml/d in April through September, 6.8
    Ml/d in October through March, converted to monthly volumes using calendar
    month lengths.

    **Net evaporation.** Monthly depths in mm, applied to the surface area, January
    to December: 4, 8, 21, 44, 71, 86, 92, 78, 47, 22, 7, 3.

    **Historical inflow.** Monthly naturalised inflows for water years 2011-12 to
    2020-21 inclusive, in Ml, are given in Table A.1 below. Water years run October
    to September.

    **Stochastic generator.** Lag-1 autoregressive model on standardised log
    inflows. Writing $z_t$ for the standardised log inflow of month $m$,

    $$z_t = 0.61 \, z_{t-1} + \sqrt{1 - 0.61^2} \, \varepsilon_t, \quad \varepsilon_t \sim N(0, 1)$$

    and the generated inflow is recovered as
    $I_t = \exp(\mu_m + \sigma_m z_t)$, where $\mu_m$ and $\sigma_m$ are the mean
    and standard deviation of the natural log of the Table A.1 inflows for calendar
    month $m$. Each replicate is initialised with $z_0 = 0$ and the first 12 months
    are discarded as burn-in. One thousand replicates of 60 years, generated with
    numpy 2.1.0 `default_rng(20240115)` drawing $\varepsilon_t$ in month order.

    **Climate adjustment.** Historical monthly inflows scaled by the central
    estimate factors, January to December: 1.08, 1.06, 1.02, 0.96, 0.91, 0.84,
    0.79, 0.81, 0.88, 0.97, 1.04, 1.07. Net evaporation depths increased by 12%
    uniformly.

    **Table A.1. Monthly naturalised inflow, Ml.**

    | Water year | Oct | Nov | Dec | Jan | Feb | Mar | Apr | May | Jun | Jul | Aug | Sep |
    |---|---|---|---|---|---|---|---|---|---|---|---|---|
    | 2011-12 | 1,723 | 2,216 | 992 | 1,836 | 2,684 | 1,246 | 1,191 | 628 | 374 | 615 | 497 | 1,362 |
    | 2012-13 | 1,317 | 1,371 | 2,002 | 2,049 | 2,468 | 1,220 | 1,328 | 1,114 | 653 | 786 | 936 | 836 |
    | 2013-14 | 1,823 | 2,304 | 2,467 | 2,106 | 2,120 | 1,718 | 1,740 | 724 | 194 | 412 | 734 | 1,120 |
    | 2014-15 | 1,377 | 1,430 | 1,827 | 2,742 | 2,441 | 1,477 | 1,123 | 1,038 | 376 | 485 | 651 | 632 |
    | 2015-16 | 1,175 | 2,510 | 1,432 | 1,738 | 1,315 | 1,865 | 550 | 1,204 | 797 | 430 | 969 | 933 |
    | 2016-17 | 1,021 | 1,292 | 2,087 | 2,118 | 1,946 | 1,676 | 1,127 | 715 | 663 | 430 | 402 | 1,004 |
    | 2017-18 | 2,550 | 2,347 | 2,053 | 2,023 | 2,156 | 1,510 | 1,041 | 627 | 590 | 360 | 661 | 1,144 |
    | 2018-19 | 1,305 | 1,469 | 1,883 | 1,780 | 1,214 | 1,828 | 1,040 | 747 | 287 | 644 | 368 | 954 |
    | 2019-20 | 1,271 | 2,541 | 2,897 | 2,721 | 776 | 1,848 | 1,351 | 744 | 843 | 656 | 821 | 918 |
    | 2020-21 | 1,089 | 1,651 | 2,260 | 2,000 | 1,771 | 1,222 | 1,010 | 587 | 581 | 565 | 579 | 1,040 |
  expected_results:
  - id: tab1
    match:
    - table 1
    - '37.1'
