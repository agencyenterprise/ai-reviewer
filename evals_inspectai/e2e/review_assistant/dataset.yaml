# Each sample hands the Review Assistant a set of documents without saying
# which is which, in an order that is not the order of the cycle, under file
# names that do not give the answer away. `role` is what the agent should take
# each one to be; it is never sent to the app.
#
# A document with `marked_up_from` is not a file on disk: it is built at upload
# time as a Word file of that markdown carrying the listed comments, so the
# fixture stays readable text (see `docx_fixture.py`).
- id: hiring_audits_unlabeled_full_cycle
  outputs:
  - revision_planning_summary
  - reviewer_response_memos
  - reviewer_coverage_report
  documents:
  - file_name: hiring-audits-2.md
    source: file://files/peer_review/hiring_audits/revised.md
    role: revised draft
  - file_name: notes for authors.md
    source: file://files/peer_review/hiring_audits/reviewer-memo.md
    role: reviewer memo
  - file_name: hiring-audits.md
    source: file://files/peer_review/hiring_audits/draft.md
    role: original draft
  - file_name: reply.md
    source: file://files/peer_review/hiring_audits/response-memo.md
    role: response memo
  expected_reviewers:
  - A
  point_count_bands:
    A:
    - 8
    - 14
  verbatim_probes:
  - These two statements are in tension.
  - Third, reconcile the layer with the Uniform Guidelines on Employee Selection Procedures,
    which already impose validation requirements and which the report does not mention at
    all.
  - A reader at an enforcement agency will stop here.
  - A rough total would make this recommendation actionable instead of rhetorical.
- id: hiring_audits_comments_only_reviewer
  outputs:
  - revision_planning_summary
  documents:
  - file_name: hiring-audits DL.docx
    marked_up_from: file://files/peer_review/hiring_audits/draft.md
    author: Dana Lee
    comments:
    - anchor: Local Law 144 requires annual bias audits
      text: Worth saying how the Local Law 144 audits have gone in practice. Is there any evidence
        yet that they changed vendor behaviour?
    - anchor: a complete audit has three layers
      text: Why three? A sentence on what each layer catches that the others miss would justify
        the structure.
    - anchor: selection rates by demographic group
      text: Cite a source for this convergence claim, or soften it.
    role: marked-up draft
  - file_name: notes for authors.md
    source: file://files/peer_review/hiring_audits/reviewer-memo.md
    role: reviewer memo
  - file_name: hiring-audits.md
    source: file://files/peer_review/hiring_audits/draft.md
    role: original draft
  # The memo's reviewer, and the reviewer who only left comments.
  expected_reviewers:
  - A
  - B
  point_count_bands:
    A:
    - 8
    - 14
    B:
    - 3
    - 3
  verbatim_probes:
  - These two statements are in tension.
  - A reader at an enforcement agency will stop here.
  - Why three? A sentence on what each layer catches that the others miss would justify the
    structure.
  - Cite a source for this convergence claim, or soften it.
